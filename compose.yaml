# compose.yaml — Kafka de un nodo (KRaft), Redpanda Console, Postgres con TimescaleDB y Grafana.
# Ver docs/specs/hito-6.md, pieza 5, docs/specs/hito-7.md, «Especificación: Postgres y el
# consumidor», y docs/specs/hito-8.md, «Especificación: Grafana».
#
# Kafka, la consola y Postgres van sin perfil (son la base); Grafana, con el perfil analitica:
# docker compose --profile analitica up --wait. Para bajarlo todo, el perfil también al bajar
# (docker compose --profile analitica down): sin él, Grafana sigue y la red no se borra.
# Kafka va sin volumen: `docker compose down` deja el broker vacío.
# Postgres guarda sus datos en el volumen edsim-postgres, que sobrevive a `docker compose down`;
# para borrarlos, `docker compose down -v`. Los topics no se crean aquí: la autocreación está
# desactivada y los crea EDsim (H6-7); las tablas las crea `edsim almacen preparar` (H7-9).
name: edsim

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092" # EXTERNAL: simulador, tests y notebook desde WSL2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners para clientes: INTERNAL dentro de la red de Docker (la consola) y
      # EXTERNAL fuera (localhost). CONTROLLER es el de KRaft y no se anuncia.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # La imagen formatea el almacenamiento con votantes estáticos.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Con solo variables de entorno, la imagen no aplica su server.properties por defecto.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Un solo nodo: los topics internos con 1 réplica (por defecto, 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Un grupo nuevo recibe sus particiones sin los 3 s de espera por defecto.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: kafka:19092

  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_USER: edsim
      # Solo para el Postgres local, que escucha en 127.0.0.1: el repositorio no guarda secretos.
      POSTGRES_PASSWORD: edsim
      POSTGRES_DB: edsim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - edsim-postgres:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h): durante el init, el servidor temporal solo escucha en el socket unix, y
      # sin -h pg_isready lo daría por sano antes del arranque definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edsim -d edsim"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Grafana (hito 8, decisión 108): solo con el perfil analitica, para que el docker compose up
  # de la integración y del notebook 06 no lo arranque sin usarlo. Sin volumen: sus fuentes y
  # sus cuadros se leen al arrancar de grafana/, y lo que se cambie en la pantalla se pierde
  # (se exporta el JSON y se sube al repositorio).
  grafana:
    image: grafana/grafana:13.3.1 # etiqueta exacta (decisión 62); el plugin de PostgreSQL, 13.0.7, va dentro
    profiles: ["analitica"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Acceso anónimo de solo lectura, en un laboratorio local; admin/admin para administrar.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/urgencias.json
      # Nada cambia sin un commit y el arranque no necesita red (D1 de la 8.6): sin las apps que
      # Grafana instala por defecto desde grafana.com en cada arranque, y sin actualizar el
      # plugin de PostgreSQL que trae la imagen.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      # La imagen es Alpine: wget de busybox, sin curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  edsim-postgres:
