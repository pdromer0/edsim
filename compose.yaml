# compose.yaml — Kafka de un nodo (KRaft), Redpanda Console y Postgres con TimescaleDB.
# Ver docs/specs/hito-6.md, pieza 5, y docs/specs/hito-7.md, «Especificación: Postgres y el
# consumidor».
#
# Sin perfiles (son la base). Kafka va sin volumen: `docker compose down` deja el broker vacío.
# Postgres guarda sus datos en el volumen edsim-postgres, que sobrevive a `docker compose down`;
# para borrarlos, `docker compose down -v`. Los topics no se crean aquí: la autocreación está
# desactivada y los crea EDsim (H6-7); las tablas las crea `edsim almacen preparar` (H7-9).
name: edsim

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092" # EXTERNAL: simulador, tests y notebook desde WSL2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners para clientes: INTERNAL dentro de la red de Docker (la consola) y
      # EXTERNAL fuera (localhost). CONTROLLER es el de KRaft y no se anuncia.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # La imagen formatea el almacenamiento con votantes estáticos.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Con solo variables de entorno, la imagen no aplica su server.properties por defecto.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Un solo nodo: los topics internos con 1 réplica (por defecto, 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Un grupo nuevo recibe sus particiones sin los 3 s de espera por defecto.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: kafka:19092

  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_USER: edsim
      # Solo para el Postgres local, que escucha en 127.0.0.1: el repositorio no guarda secretos.
      POSTGRES_PASSWORD: edsim
      POSTGRES_DB: edsim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - edsim-postgres:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h): durante el init, el servidor temporal solo escucha en el socket unix, y
      # sin -h pg_isready lo daría por sano antes del arranque definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edsim -d edsim"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  edsim-postgres:
