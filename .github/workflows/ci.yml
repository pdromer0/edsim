name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela su ejecución anterior. En main el grupo es el commit, así que
# nunca se cancela una ejecución de main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # logical: con psutil, auto cuenta núcleos físicos, que en el runner pueden ser la mitad.
      - run: uv run pytest -n logical --dist loadfile

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Notebooks (modo rápido)
        run: uv run pytest --nbmake notebooks/
        env:
          EDSIM_NB_RAPIDO: "1"

  tests-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-packages
      - run: uv run --package edsim-app pytest app/tests
