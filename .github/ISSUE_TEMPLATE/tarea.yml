name: Tarea
description: Trabajo planificado que se hace con plan, rama y pull request.
labels: ["tipo:tarea"]
body:
  - type: markdown
    attributes:
      value: |
        El issue resume y enlaza la especificación; no la copia. El PR que la cierra lleva «Closes #N».
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué cambia cuando la tarea termina, en dos o tres frases.
    validations:
      required: true
  - type: textarea
    id: contenido
    attributes:
      label: Contenido
      description: Qué incluye, resumido; casillas si son varias piezas.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: De 3 a 6 viñetas comprobables.
    validations:
      required: true
  - type: input
    id: especificacion
    attributes:
      label: Enlace a la especificación
      placeholder: docs/specs/hito-N.md#seccion
  - type: input
    id: rama
    attributes:
      label: Rama
      placeholder: feat/…
  - type: dropdown
    id: quien
    attributes:
      label: Quién
      description: El formulario no pone etiquetas; añade también la de `quien:…`.
      options:
        - Claude Code
        - Codex
        - Pedro
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde y modelo
      description: En la nube por defecto; en local si necesita Docker, la app en el navegador o ficheros del portátil (docs/proceso/flujo.md, «Dónde corre cada tarea»).
      placeholder: "Nube. Sonnet, esfuerzo alto"
  - type: checkboxes
    id: critica
    attributes:
      label: Crítica
      description: El formulario no pone etiquetas; añade también la de `critica`.
      options:
        - label: Revisión reforzada (`/code-review high` y `@codex review`)
  - type: input
    id: depende
    attributes:
      label: Depende de
      placeholder: "#N, #M"
