[project]
name = "edsim"
version = "0.1.0"
description = "Simulador de urgencias hospitalarias que genera datos sintéticos para un laboratorio de analítica"
readme = "README.md"
authors = [
    { name = "pdromer0", email = "115772852+pdromer0@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "simpy>=4.1.2",
]

[project.scripts]
edsim = "edsim.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbmake>=1.5.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: tests estadísticos largos; el hook de Claude Code los excluye",
]
