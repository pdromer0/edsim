edad = [0.4, 0.8, 1.8, 2.4]         # orientativo: EPOC e insuficiencia cardiaca en mayores
franja = [1.0, 1.0, 1.2]            # orientativo: disnea paroxística nocturna de la insuficiencia cardiaca
