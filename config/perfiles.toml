pruebas = { analitica = 72, radiografia = 12, ecg = 9, imagen = 11 }   # orientativo, elegido por su marginal: 69,6 / 15,2 / 15,6 / 15,2 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 9,95 %
