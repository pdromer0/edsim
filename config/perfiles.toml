[motivos.cutaneo]
nombre = "Cutáneo / alergia"
peso_base = 4.146                   # derivado
franja = [1.0, 1.0, 0.7]            # orientativo: consulta demorable, no se acude de madrugada
dia = [1.0, 1.2]                    # orientativo: consulta demorable con el centro de salud cerrado
estacion = [0.9, 1.2, 1.2, 0.9]     # orientativo: alergias estacionales, picaduras y quemaduras solares
gravedad = { media = -0.75, desviacion = 0.56 }   # orientativo, baja: banal; la anafilaxia es la cola
pruebas = { analitica = 14, radiografia = 3, ecg = 3, imagen = 2 }   # orientativo, elegido por su marginal: 9,9 / 2,9 / 3,2 / 1,6 % en un año
