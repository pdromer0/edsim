gravedad = { media = 0.19, desviacion = 0.75 }   # orientativo, media: ansiedad frente a agitación o ideación suicida; sin patrón por edad
pruebas = { analitica = 12, radiografia = 2, ecg = 8, imagen = 2 }   # orientativo, elegido por su marginal: 19,8 / 2,5 / 12,2 / 2,9 % en un año
ingreso = 2.636                     # derivado (catálogo: bajo); marginal del año: 3,47 %
duracion = 1.3                      # orientativo: «pocas» pruebas: tóxicos y organicidad; entrevista larga

[motivos.palpitaciones]
