estacion = [1.0, 1.0, 1.2, 1.0]     # orientativo: cólico renal por deshidratación con el calor
gravedad = { media = -0.18, por_edad = [0.0, 0.0, 0.09, 0.19], desviacion = 0.66 }   # orientativo, baja-media: infección de orina y cólico; retención y urosepsis en mayores
pruebas = { analitica = 59, radiografia = 17, ecg = 3, imagen = 32 }   # orientativo, elegido por su marginal: 60,0 / 20,0 / 5,0 / 35,5 % en un año
