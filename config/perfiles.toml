franja = [1.0, 1.0, 1.8]            # orientativo: ocio nocturno
dia = [1.0, 1.7]                    # orientativo: fin de semana; noche × fin de semana = 3,06 (el «×3» de la especificación)
gravedad = { media = 0.10, desviacion = 1.13 }   # orientativo, variable: embriaguez leve frente a sobredosis o coma
pruebas = { analitica = 78, radiografia = 7, ecg = 46, imagen = 6 }   # orientativo, elegido por su marginal: 74,7 / 8,3 / 49,8 / 8,4 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 9,88 %
duracion = 1.1                      # orientativo: analítica con tóxicos y ECG por el QT; vigilancia

# Parada / crítico: 0,3 % del catálogo («< 1 %»; 0,5 hasta la tarea 4.6a). Su
# gravedad es orientativa, elegida por criterio: desviación de 0,25 (poco
# dispersa: el compromiso vital no depende de la edad) y la menor media de una
# rejilla de 0,01 con la que, tras rederivar pesos, ruido, sesgo y umbrales, al
# menos el 99 % de las paradas de un año es nivel real 1 y al menos el 97 %
# recibe nivel 1 asignado y va a la puerta (99,97 % y 97,05 %; con 4,20, el
# 96,91 %). Manda el asignado: el ruido del triaje dispersa más que la parada.
#   edsim.profiles.derivation.severity_mean_for(perfiles, llegadas, "parada", 0.25,
#       real_min=0.99, assigned_min=0.97, start=4.0)
#   con llegadas = load_profile("config/llegadas.toml"); la cascada, derive_written_values.
[motivos.parada]
nombre = "Parada / crítico"
peso_base = 0.324                   # derivado
edad = [0.2, 0.8, 1.8, 2.5]         # orientativo: muerte súbita y parada en mayores
gravedad = { media = 4.21, desviacion = 0.25 }   # orientativo, elegido por criterio (ver arriba): muy alta y poco dispersa, a cualquier edad (4,38 y 0,27 antes de la transformación común)
pruebas = { analitica = 36, radiografia = 61, ecg = 83, imagen = 4 }   # orientativo, elegido por su marginal: 99,3 / 92,8 / 99,4 / 54,2 % en un año
ingreso = 30.66                     # derivado (catálogo: muy alto); marginal del año: 74,21 %
duracion = 1.0                      # orientativo: «todas»; la base del nivel 1 ya es larga

[motivos.otros]
nombre = "Otros"
peso_base = 10.698                  # derivado; sin factores: cajón de sastre
gravedad = { media = -0.56, desviacion = 0.75 }   # orientativo, baja: cajón de sastre, en su mayoría banal
pruebas = { analitica = 22, radiografia = 10, ecg = 7, imagen = 4 }   # orientativo, elegido por su marginal: 19,7 / 10,4 / 8,5 / 3,9 % en un año
ingreso = 2.636                     # derivado (catálogo: bajo); marginal del año: 2,77 %
duracion = 0.9                      # orientativo: «pocas» pruebas

[triaje]
# Reparto de niveles asignados 1 a 5 en adultos (calibrado): Emergencias 2013,
# Hospital do Salnés. Suma 100,1 por el redondeo de la fuente y se normaliza.
reparto_objetivo = [0.4, 12.1, 33.6, 52.6, 1.4]
# % de infratriaje (asignado menos urgente que el real) y de sobretriaje
# (calibrado): concordancia del Manchester en Asturias, Enfermería Clínica 2026.
infratriaje = 10.1
sobretriaje = 6.3
# Ruido (desviación del error de la enfermera, en unidades de G) y sesgo
# (negativo: tiende a infratriar), calibrados para dar el infratriaje y el
# sobretriaje de arriba sobre la mezcla de G de un año, redondeados a 3 decimales:
#   triage_error_for(load_profiles("config/perfiles.toml"), load_profile("config/llegadas.toml"))
# (edsim.profiles.severity). Con G normal estándar, la especificación daba 0,32 y
# -0,08; la mezcla de motivos y edades no es normal y pide algo más de ruido.
ruido = 0.334                       # calibrado
sesgo = -0.081                      # calibrado
# Umbrales c1 > c2 > c3 > c4 sobre G + ε (derivado): dan reparto_objetivo como
# reparto asignado de un año con el ruido y el sesgo escritos, redondeados a 3
# decimales: thresholds_for(perfiles, llegadas). No se recalculan al cargar: un
# escenario con más gravedad (gripe, accidente múltiple) debe dar más niveles
# urgentes, y no volver al reparto objetivo. Si cambia la gravedad, un factor o
# el ruido, hay que volver a calcularlos (lo comprueba un test).
umbrales = [3.341, 1.130, -0.047, -2.164]   # derivado
# Duración del triaje de enfermería, [mediana, p90] en minutos (orientativo):
# una sola lognormal para los niveles 2 a 5, sin factor por motivo. Se sortea
# para todos; el nivel 1 se clasifica en la puerta y no la usa.
duracion = [5, 10]

[duraciones]
# Duraciones del médico, [mediana, p90] en minutos por nivel real 1 a 5
# (orientativo; fijas durante la calibración del hito 4, decisión 41). Usan el
# nivel real, no el asignado: el médico atiende al paciente que tiene delante.
# Cada motivo multiplica la mediana por su duracion (k), sin cambiar σ.
# Valoración: medias de 48,87 / 37,33 / 27,01 / 18,66 / 12,91 minutos.
valoracion = [[40, 90], [30, 70], [22, 50], [15, 35], [10, 25]]
# Reevaluación tras las pruebas (solo si hay ronda): medias de
# 17,36 / 14,14 / 11,58 / 9,02 / 6,95 minutos.
reevaluacion = [[15, 30], [12, 25], [10, 20], [8, 15], [6, 12]]

# Tipos de prueba (orientativo), en una sola ronda por paciente (decisión 42).
# P(pedir) = logística(logit(p del motivo) + ln(or_gravedad)·G + ln(or_mayor)·mayor),
# con mayor = banda de 65 años o más. P(alterado) = logística(logit(base) +
# ln(alterado.or_gravedad)·G); el resultado se sortea siempre. respuesta es
# [mediana, p90] en minutos desde el pedido; respuesta_franja multiplica la
# mediana según la franja del pedido (mañana, tarde, noche) y vale 1 si falta.

[pruebas.analitica]
respuesta = [60, 150]
respuesta_franja = [1.0, 1.1, 0.9]  # pico de muestras por la tarde; de noche entran menos
or_gravedad = 3.3                   # ln 3,3 ≈ 1,2: la analítica sigue a la gravedad
or_mayor = 2.2                      # ln 2,2 ≈ 0,8: pluripatología y fármacos
alterado = { base = 30, or_gravedad = 2.5 }   # % alterado con G = 0

[pruebas.radiografia]
respuesta = [30, 75]
respuesta_franja = [1.0, 1.0, 1.2]  # un solo técnico de noche
or_gravedad = 1.5                   # depende más del motivo que de la gravedad
or_mayor = 1.8                      # caídas y tórax en mayores
alterado = { base = 25, or_gravedad = 2.0 }

[pruebas.ecg]
respuesta = [10, 25]                # se hace y se lee a pie de cama; sin factor de franja
or_gravedad = 2.0
or_mayor = 3.0                      # casi rutina en mayores
alterado = { base = 20, or_gravedad = 2.0 }

[pruebas.imagen]
respuesta = [100, 240]              # eco o TC: petición, realización e informe
respuesta_franja = [1.0, 1.1, 1.3]  # de noche, radiólogo de guardia y sin eco programada
or_gravedad = 2.0
or_mayor = 1.8                      # TC craneal en caídas con anticoagulantes
alterado = { base = 35, or_gravedad = 2.0 }

# Bloque del hito 5 (decisiones 68 a 72; docs/specs/hito-5.md, «Valores orientativos»).

[abandono]
# Paciencia por nivel real: [mediana, p90] en minutos (decisión 70). La forma, orientativa
# (p90 = 3 × mediana, σ = 0,857), y el orden de los niveles son los de partida:
# [[1440, 4320], [480, 1440], [240, 720], [150, 450], [120, 360]]. Su nivel, calibrado en
# la tarea 5.6 con un factor común k = 4 sobre medianas y p90 contra el abandono (1-4 %,
# SAS 1,82): 1,68 % con 2026 y 2,00 % con 2027, con la cama y los 36 boxes de
# config/centro.toml (rejilla 2^(i/4) de 1 a 8: k = 3,364 da 2,13 %);
#   uv run edsim calibracion sensibilidad --mando paciencia --comprobacion 2027
# Discrepancia estructural (docs/calibracion/registro.md, tarea 5.6): la mediana del nivel
# 4 es de 600 min y la del 5 de 480, frente a las 2 h que declaran los pacientes en la
# encuesta de Shaikh; la piden el abandono y el reloj A con la plantilla anual.
paciencia = [[5760, 17280], [1920, 5760], [960, 2880], [600, 1800], [480, 1440]]
paciencia_edad = [0.8, 1.0, 1.0, 1.0]   # orientativo: los jóvenes se van antes

[destinos]
# Logística multinomial con el alta de referencia (decisión 71). Los objetivo son del SAS
# (CMBD de urgencias 2013, adultos). or_gravedad del ingreso 1,5 y del exitus 15 (tarea 5.2):
# con ellos el ingreso por nivel asignado es 68,1 / 28,1 / 11,8 / 4,3 / 1,9 % y la mitad de
# los exitus son paradas.
ingreso = { objetivo = 9.90, or_gravedad = 1.5, or_mayor = 1.5, or_alterada = 1.5 }
traslado = { objetivo = 0.75, base = 0.7639, or_gravedad = 1.5 }   # base derivada
exitus = { objetivo = 0.11, base = 0.001937, or_gravedad = 15.0 }   # base derivada
