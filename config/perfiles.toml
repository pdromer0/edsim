pruebas = { analitica = 59, radiografia = 73, ecg = 32, imagen = 2 }   # orientativo, elegido por su marginal: 84,8 / 85,0 / 65,1 / 7,3 % en un año
ingreso = 12.85                     # derivado (catálogo: alto); marginal del año: 33,46 %
duracion = 1.1                      # orientativo: gasometría con la analítica y Rx de tórax; angioTC raro

[motivos.malestar]
nombre = "Malestar general / debilidad"
peso_base = 5.618                   # derivado
edad = [0.5, 0.9, 1.8, 2.5]         # orientativo: fragilidad y pluripatología
gravedad = { media = 0.29, por_edad = [-0.28, 0.0, 0.09, 0.28], desviacion = 0.75 }   # orientativo, media: inespecífico; en frágiles esconde sepsis o descompensación
pruebas = { analitica = 68, radiografia = 24, ecg = 38, imagen = 4 }   # orientativo, elegido por su marginal: 79,9 / 35,4 / 60,0 / 8,4 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 13,42 %
