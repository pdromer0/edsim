peso_base = 4.257                   # derivado
franja = [1.0, 1.0, 0.7]            # orientativo: consulta demorable
dia = [1.0, 1.2]                    # orientativo: consulta demorable con el centro de salud cerrado
estacion = [1.2, 1.0, 0.9, 1.0]     # orientativo: otitis y faringitis de invierno
gravedad = { media = -0.84, desviacion = 0.56 }   # orientativo, baja: otitis, faringitis, cuerpo extraño ocular
pruebas = { analitica = 8, radiografia = 4, ecg = 2, imagen = 4 }   # orientativo, elegido por su marginal: 5,2 / 3,7 / 2,0 / 3,1 % en un año
ingreso = 1.322                     # derivado (catálogo: muy bajo); marginal del año: 1,16 %
duracion = 0.8                      # orientativo: «pocas» pruebas; consulta breve

[motivos.digestivo]
