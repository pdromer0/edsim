[motivos.dolor_toracico]
nombre = "Dolor torácico"
peso_base = 5.337                   # derivado
edad = [0.6, 1.3, 1.4, 1.2]         # orientativo: cardiopatía isquémica de 45 a 79; en ≥80 se presenta atípica
estacion = [1.1, 1.0, 0.9, 1.0]     # orientativo: más síndromes coronarios en invierno
gravedad = { media = 0.94, por_edad = [-0.38, 0.0, 0.19, 0.28], desviacion = 0.75 }   # orientativo, media-alta: mecánico o ansiedad en jóvenes; síndrome coronario desde los 45
pruebas = { analitica = 65, radiografia = 56, ecg = 96, imagen = 2 }   # orientativo, elegido por su marginal: 84,9 / 69,9 / 98,2 / 5,9 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 17,96 %
duracion = 1.0                      # orientativo: ECG casi universal, troponinas y Rx

[motivos.neurologico]
nombre = "Neurológico"
peso_base = 4.983                   # derivado
