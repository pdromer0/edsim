peso_base = 2.064                   # derivado
edad = [0.7, 1.1, 1.5, 1.3]         # orientativo: fibrilación auricular con la edad
gravedad = { media = 0.29, por_edad = [-0.28, 0.0, 0.09, 0.19], desviacion = 0.66 }   # orientativo, media: taquicardias benignas en jóvenes; fibrilación auricular rápida en mayores
pruebas = { analitica = 58, radiografia = 18, ecg = 97, imagen = 2 }   # orientativo, elegido por su marginal: 70,1 / 25,3 / 98,0 / 3,7 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 11,96 %
duracion = 0.9                      # orientativo: ECG casi universal y analítica; cuadro acotado

[motivos.intoxicacion]
