estacion = [1.0, 1.0, 1.2, 1.0]     # orientativo: calor, deshidratación e hipotensión en verano
gravedad = { media = 0.29, por_edad = [-0.38, 0.0, 0.19, 0.28], desviacion = 0.75 }   # orientativo, media: vasovagal en jóvenes; arritmia o hemorragia en mayores
pruebas = { analitica = 49, radiografia = 9, ecg = 92, imagen = 8 }   # orientativo, elegido por su marginal: 64,9 / 14,5 / 94,9 / 14,9 % en un año
ingreso = 6.527                     # derivado (catálogo: medio); marginal del año: 12,89 %
