gravedad = { media = 0.38, por_edad = [-0.28, 0.0, 0.28, 0.38], desviacion = 1.13 }   # orientativo, variable: cefalea y vértigo frente a ictus, que crece con la edad
pruebas = { analitica = 40, radiografia = 4, ecg = 13, imagen = 40 }   # orientativo, elegido por su marginal: 59,7 / 7,3 / 30,6 / 54,7 % en un año
