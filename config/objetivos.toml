[objetivos.ingreso_observado]
# El ingreso se deriva en perfiles.toml (9,90 % de los llegados, con el destino sorteado);
# aquí se comprueba el observado, que rebaja quien habría ingresado y se fue.
medida = "departure"
destino = "ingreso"
estadistico = "porcentaje_de_llegadas"
referencia = 9.90
horquilla = [8, 13]
uso = "comprobacion"
fuente = "SAS, Urgencias hospitalarias en el Servicio Andaluz de Salud, CMBD 2013"
enlace = "https://www.sspa.juntadeandalucia.es/servicioandaluzdesalud/sites/default/files/sincfiles/wsas-media-pdf_publicacion/2020/UrgenciasHospitalariasenelServicioAndaluzdeSalud.CMBD2013_0.pdf"
nota = "Ingreso de adultos: (8,55 − 0,21 × 3,47) / 0,79 = 9,90 %, con un 21 % de menores que ingresan un 3,47 %"
