# Centro base para el motor. Ver docs/specs/hito-3.md y docs/specs/hito-4.md («Calibración»).
# La plantilla (enfermería de triaje y médicos) está calibrada en la tarea 4.6c con la
# ventana anual.
#
# Qué lee cada modelo (tareas 4.9 y 5.6, decisiones 36, 44 y 68):
# - El modelo del hito 5, el de por defecto desde la tarea 5.6: turnos, plantilla, boxes,
#   los niveles que esperan los resultados fuera y la espera de cama ([camas]). Cada
#   paciente, su paciencia y su destino salen de config/perfiles.toml, con su bloque del
#   hito 5. Un centro lleva [camas] (hito 5) o [destino] (modelos provisional y del hito 4),
#   nunca los dos.
# - El modelo clínico del hito 4, con [destino] y sin [camas]: este fichero hasta la tarea
#   5.6, congelado en tests/data/centro_h4.toml.
# - El modelo provisional del hito 3 necesita además [triaje], [duraciones], [pruebas] y
#   [destino], que este fichero no tiene: su centro es tests/data/centro_ejemplo.toml
#   (edsim motor simular --provisional --centro tests/data/centro_ejemplo.toml, y edsim
#   motor validar).

[turnos]
# Hora de inicio de los turnos de mañana, tarde y noche
inicio = [8, 15, 22]

[recursos]
# Plantilla por turno: mañana, tarde, noche. Calibrada en la tarea 4.6c con la regla de
# la plantilla equivalente, ⌈carga del turno / u⌉, un u por mando, y la ventana anual:
# 12 réplicas de 14 días, la m desde el primer lunes del mes m+1, semilla 2026 (registro
# en docs/calibracion/registro.md; antes, [3, 2, 1] y [12, 11, 5] en la tarea 4.6b, con
# la quincena de enero, y [3, 3, 2] y [12, 12, 7] en el hito 3):
# - enfermería de triaje, contra el pretriaje medio (6-15 min): la regla eligió
#   [2, 2, 1] (13,21 min, la más cercana a 12,4), pero la semilla 2027 la vetó (15,16:
#   fuera de la horquilla) y se tomó la siguiente, [3, 2, 1] (6,78 con 2026 y 7,86 con
#   2027): u de 0,795 a 0,8325 (decisión 41, revisada en la tarea 4.6c);
#   uv run edsim calibracion sensibilidad --mando enfermeria_triaje --comprobacion 2027
# - médicos, con esa enfermería, contra el reloj A de los niveles 2 a 5 (35-70 min):
#   [12, 11, 4], la única que pasa (42,10 min), con u de 0,85; con 2027, 43,29, pasa;
#   uv run edsim calibracion sensibilidad --mando medicos --comprobacion 2027
# Comprobación independiente, después del veto de 2027 (pretriaje 7,76 y reloj A 41,20):
#   uv run edsim calibracion evaluar --semilla 2028
# Es una plantilla para todo el año: enero queda cerca de la saturación (reloj A de
# 105 min con 2026) y el refuerzo de invierno queda para versiones posteriores.
# Con el modelo del hito 5 (tarea 5.6), medida de nuevo con la cama y la paciencia
# elegidas, la plantilla pasa y no cambia: pretriaje 6,73 y reloj A de los niveles 2 a 5
# 35,31 con 2026 (7,77 y 36,63 con 2027);
#   uv run edsim calibracion evaluar (y --semilla 2027)
enfermeria_triaje = [3, 2, 1]
medicos = [12, 11, 4]
# Capacidad física, igual en todos los turnos. Derivada en la tarea 5.6 (decisión de
# Pedro del 12 de noviembre de 2026): los 30 del hito 4, calibrado sin boxes ocupados
# por ingresados, más los que ocupa de media la espera de cama, por la ley de Little,
# redondeados al entero más cercano: λ · W = 6,44 con 2026 (6,56 con 2027), 30 + 6 = 36.
#   uv run edsim calibracion evaluar  (línea «Esperando cama (ley de Little …)»)
boxes = 36
# Niveles asignados cuyos pacientes dejan el box al pedir las pruebas y esperan
# los resultados fuera, en una sala sin límite de capacidad; con los resultados
# vuelven a pedir box con su misma prioridad para la reevaluación (decisión 45,
# tarea 4.6a). Niveles 2 a 5, en orden creciente; el 1 nunca sale del box. Solo
# la usa el modelo clínico: el provisional la ignora y no cambia. Es opcional y,
# si falta, vale [] (nadie espera fuera), no [4, 5]: así la copia de centro.toml
# de una ejecución anterior a la 4.6a sigue significando lo que significaba.
espera_resultados_fuera = [4, 5]

[camas]
# Espera de cama de los ingresados, en su box (decisión 72, H5-6): [mediana, p90] en
# minutos, con factor 1. El cociente p90 / mediana = 3, por criterio; la mediana,
# calibrada en la tarea 5.6 contra la estancia de los ingresados (360-600 min, SAS
# 472,5), con la regla de siempre (la más cercana a la referencia de las que pasan, con
# el veto de 2027), antes y después de la paciencia: 210 (de 240), con 470,8 y 473,3
# (paciencia de partida) y 479,9 y 481,1 (paciencia calibrada) con 2026 y 2027;
#   uv run edsim calibracion sensibilidad --mando espera_cama --comprobacion 2027
espera = [210, 630]
# Factor por el turno del pedido de cama: mañana, tarde, noche, con los turnos de [turnos]
# (las altas de planta salen por la mañana). factor_estacion, opcional, vale 1.
factor_turno = [0.8, 1.0, 1.5]
