# Unit tests de oro (docs/specs/hito-8.md, «Especificación: oro»; tarea 8.5). Cada uno pilla un
# error que no pilla ningún otro. Los valores esperados salen del plan de la 8.5, con un script
# en Python independiente de los modelos (la salida, en el PR). Filas inventadas del 5 y el 6 de
# enero de 2026, a las +01:00: el origen de cada ejecución es el 5 de enero a las 00:00.
#
# Como en la preparación y en plata, cada test fija su hoja con «overrides» y solo se comparan
# las columnas que nombra cada «expect».

unit_tests:

  - name: censo_a_la_hora_en_punto
    description: >
      W = 950 min (no es una hora en punto) y H = 1140: las horas k = 16, 17 y 18; la 19 no
      entra, porque 60·19 = H. A sale justo a las 17:00 y B llega justo a las 16:00; C tiene
      una salida anterior a su llegada (los relojes), D una llegada duplicada, E una salida sin
      llegada y G llega a las 17:30. Salen 2, 2 y 3. Pilla contar al que sale justo a la hora
      en punto (V9: 3 a las 17:00), no contar al que llega justo, contar a quien no tiene
      llegada o dos veces al de la llegada duplicada, y una ventana mal redondeada.
    model: censo
    overrides: &hospital {vars: {hoja: hospital}}
    given:
      - input: ref('parametros')
        rows:
          - {run_id: c, origen: "2026-01-05 00:00:00+01", calentamiento_min: 950, horizonte_min: 1140, fin_dato_min: 1140}
      - input: ref('registros_vigentes')
        rows:
          - {run_id: c, event_id: c-01, episode_id: A, event_type: patient_arrived, event_time: "2026-01-05 15:30:00+01", recorded_time: "2026-01-05 15:30:00+01"}
          - {run_id: c, event_id: c-02, episode_id: A, event_type: patient_departed, event_time: "2026-01-05 17:00:00.000+01", recorded_time: "2026-01-05 17:00:00+01"}
          - {run_id: c, event_id: c-03, episode_id: B, event_type: patient_arrived, event_time: "2026-01-05 16:00:00.000+01", recorded_time: "2026-01-05 16:00:00+01"}
          - {run_id: c, event_id: c-04, episode_id: C, event_type: patient_arrived, event_time: "2026-01-05 16:10:00+01", recorded_time: "2026-01-05 16:10:00+01"}
          - {run_id: c, event_id: c-05, episode_id: C, event_type: patient_left_wbs, event_time: "2026-01-05 16:05:00+01", recorded_time: "2026-01-05 16:05:00+01"}
          - {run_id: c, event_id: c-06, episode_id: D, event_type: patient_arrived, event_time: "2026-01-05 16:20:00+01", recorded_time: "2026-01-05 16:20:00+01"}
          - {run_id: c, event_id: c-07, episode_id: D, event_type: patient_arrived, event_time: "2026-01-05 16:20:00+01", recorded_time: "2026-01-05 16:21:00+01"}
          - {run_id: c, event_id: c-08, episode_id: D, event_type: patient_departed, event_time: "2026-01-05 18:30:00+01", recorded_time: "2026-01-05 18:30:00+01"}
          - {run_id: c, event_id: c-09, episode_id: E, event_type: patient_departed, event_time: "2026-01-05 17:30:00+01", recorded_time: "2026-01-05 17:30:00+01"}
          - {run_id: c, event_id: c-10, episode_id: G, event_type: patient_arrived, event_time: "2026-01-05 17:30:00+01", recorded_time: "2026-01-05 17:30:00+01"}
    expect:
      rows:
        - {run_id: c, hora: "2026-01-05 16:00:00+01", censo: 2}
        - {run_id: c, hora: "2026-01-05 17:00:00+01", censo: 2}
        - {run_id: c, hora: "2026-01-05 18:00:00+01", censo: 3}

  - name: censo_hasta_el_fin_del_dato
    description: >
      D1 de la 8.7: las horas acaban en el fin del dato (parametros), no en el horizonte. W = 960
      y H = 1140 en las cuatro, con una llegada a las 15:30 sin salida. completa (fin 1140): las
      horas 16, 17 y 18. en_curso (la última anotación, 1050): 16 y 17; la 18 aún no ha llegado.
      interrumpida (un fin justo en una hora en punto, 1080): 16 y 17; la de su fin no entra, como
      la del horizonte. sin_datos (fin nulo): ninguna. Pilla cortar en el horizonte (V15:
      en_curso e interrumpida con la 18) y cortar con <= (V16: la 19 de completa y la 18 de
      interrumpida).
    model: censo
    overrides: *hospital
    given:
      - input: ref('parametros')
        rows:
          - {run_id: completa, origen: "2026-01-05 00:00:00+01", calentamiento_min: 960, horizonte_min: 1140, fin_dato_min: 1140}
          - {run_id: en_curso, origen: "2026-01-05 00:00:00+01", calentamiento_min: 960, horizonte_min: 1140, fin_dato_min: 1050}
          - {run_id: interrumpida, origen: "2026-01-05 00:00:00+01", calentamiento_min: 960, horizonte_min: 1140, fin_dato_min: 1080}
          - {run_id: sin_datos, origen: "2026-01-05 00:00:00+01", calentamiento_min: 960, horizonte_min: 1140, fin_dato_min: null}
      - input: ref('registros_vigentes')
        rows:
          - {run_id: completa, event_id: c-1, episode_id: A, event_type: patient_arrived, event_time: "2026-01-05 15:30:00+01", recorded_time: "2026-01-05 15:30:00+01"}
          - {run_id: en_curso, event_id: e-1, episode_id: A, event_type: patient_arrived, event_time: "2026-01-05 15:30:00+01", recorded_time: "2026-01-05 15:30:00+01"}
          - {run_id: interrumpida, event_id: i-1, episode_id: A, event_type: patient_arrived, event_time: "2026-01-05 15:30:00+01", recorded_time: "2026-01-05 15:30:00+01"}
    expect:
      rows:
        - {run_id: completa, hora: "2026-01-05 16:00:00+01", censo: 1}
        - {run_id: completa, hora: "2026-01-05 17:00:00+01", censo: 1}
        - {run_id: completa, hora: "2026-01-05 18:00:00+01", censo: 1}
        - {run_id: en_curso, hora: "2026-01-05 16:00:00+01", censo: 1}
        - {run_id: en_curso, hora: "2026-01-05 17:00:00+01", censo: 1}
        - {run_id: interrumpida, hora: "2026-01-05 16:00:00+01", censo: 1}
        - {run_id: interrumpida, hora: "2026-01-05 17:00:00+01", censo: 1}

  - name: cohorte_de_llegada
    description: >
      W = 960 y turnos a las 8, 15 y 22. P llega a las 16:58, se tria a las 17:04 y la ve el
      médico a las 17:30: cuenta en la hora de las 16, en la tarde del 5, con 6 y 32 min. R
      llega el 6 a las 03:00 (la noche del 5) y S el 6 a las 08:00 justas (la mañana del 6). X
      llega antes de la ventana y tiene su fila: la cohorte es de todos los episodios. Pilla
      apuntar las esperas a la hora del triaje (V10: P a las 17:00) y una noche con la fecha
      del día en que acaba.
    model: cohorte
    overrides: *hospital
    given:
      - input: ref('parametros')
        rows:
          - {run_id: c, origen: "2026-01-05 00:00:00+01", fecha_origen: "2026-01-05", calentamiento_min: 960, horizonte_min: 4320, fin_horizonte: "2026-01-08 00:00:00+01"}
      - input: ref('turnos')
        rows:
          - {turno: manana, inicio: 8}
          - {turno: tarde, inicio: 15}
          - {turno: noche, inicio: 22}
      - input: ref('registros_vigentes')
        rows:
          - {run_id: c, event_id: c-01, episode_id: P, event_type: patient_arrived, event_time: "2026-01-05 16:58:00+01", recorded_time: "2026-01-05 16:58:00+01"}
          - {run_id: c, event_id: c-02, episode_id: P, event_type: triage_completed, event_time: "2026-01-05 17:04:00+01", recorded_time: "2026-01-05 17:04:00+01", payload: '{"nivel": 3}'}
          - {run_id: c, event_id: c-03, episode_id: P, event_type: assessment_started, event_time: "2026-01-05 17:30:00+01", recorded_time: "2026-01-05 17:30:00+01", payload: '{"tipo": "inicial"}'}
          - {run_id: c, event_id: c-04, episode_id: R, event_type: patient_arrived, event_time: "2026-01-06 03:00:00+01", recorded_time: "2026-01-06 03:00:00+01"}
          - {run_id: c, event_id: c-05, episode_id: S, event_type: patient_arrived, event_time: "2026-01-06 08:00:00.000+01", recorded_time: "2026-01-06 08:00:00+01"}
          - {run_id: c, event_id: c-06, episode_id: X, event_type: patient_arrived, event_time: "2026-01-05 15:00:00+01", recorded_time: "2026-01-05 15:00:00+01"}
    expect:
      rows:
        - {episode_id: P, hora_llegada: "2026-01-05 16:00:00+01", fecha_turno: "2026-01-05", turno: tarde, espera_triaje_min: 6.0, espera_medico_min: 32.0}
        - {episode_id: R, hora_llegada: "2026-01-06 03:00:00+01", fecha_turno: "2026-01-05", turno: noche, espera_triaje_min: null, espera_medico_min: null}
        - {episode_id: S, hora_llegada: "2026-01-06 08:00:00+01", fecha_turno: "2026-01-06", turno: manana, espera_triaje_min: null, espera_medico_min: null}
        - {episode_id: X, hora_llegada: "2026-01-05 15:00:00+01", fecha_turno: "2026-01-05", turno: tarde, espera_triaje_min: null, espera_medico_min: null}

  - name: cohorte_sigue_dentro
    description: >
      Tres episodios sin salida, con su última anotación (hecho → anotación): U, 09:00 →
      09:59:59.999 del 6; V, 08:00 → 10:00:00 del 6; Z, 09:00 → 09:00 del 7, la última de la
      ejecución. El ahora es el fin del dato, el 7 a las 10:00 (parametros), y el umbral, 24 h
      antes: U se olvidó la salida; V y Z siguen dentro. Pilla mirar el event_time en vez de la
      anotación (M2 de la 8.5: V olvidada), un umbral con < en vez de <= y tomar como ahora la
      última anotación en vez del fin del dato (V17 de la 8.7: U dentro, con el umbral a las
      09:00 del 6).
    model: cohorte
    overrides: {vars: {hoja: hospital, margen_sin_salida_min: 1440}}
    given:
      - input: ref('parametros')
        rows:
          - {run_id: c, origen: "2026-01-05 00:00:00+01", fecha_origen: "2026-01-05", calentamiento_min: 960, horizonte_min: 4320, fin_horizonte: "2026-01-08 00:00:00+01", fin_dato: "2026-01-07 10:00:00+01"}
      - input: ref('turnos')
        rows:
          - {turno: manana, inicio: 8}
          - {turno: tarde, inicio: 15}
          - {turno: noche, inicio: 22}
      - input: ref('registros_vigentes')
        rows:
          - {run_id: c, event_id: c-01, episode_id: U, event_type: patient_arrived, event_time: "2026-01-06 09:00:00+01", recorded_time: "2026-01-06 09:59:59.999+01"}
          - {run_id: c, event_id: c-02, episode_id: V, event_type: patient_arrived, event_time: "2026-01-06 08:00:00+01", recorded_time: "2026-01-06 10:00:00.000+01"}
          - {run_id: c, event_id: c-03, episode_id: Z, event_type: patient_arrived, event_time: "2026-01-07 09:00:00+01", recorded_time: "2026-01-07 09:00:00+01"}
    expect:
      rows:
        - {episode_id: U, sigue_dentro: false, salida_olvidada: true}
        - {episode_id: V, sigue_dentro: true, salida_olvidada: false}
        - {episode_id: Z, sigue_dentro: true, salida_olvidada: false}

  - name: ocupacion_de_boxes
    description: >
      Cuatro boxes en el maestro y W = 960, H = 1140: las horas 16, 17 y 18. El box 1 tiene
      una estancia de 15:30 a 17:00 justas y otra de 17:30 a 18:30; el 2, una abierta desde
      las 16:00 justas de un episodio que sigue dentro; el 3, una abierta de un episodio cuya
      salida se olvidó; el 4, una abierta con sin_pareja (su cierre se olvidó); y el 99, que no
      está en el maestro. Salen 2, 1 y 2 boxes (50, 25 y 50 %). Pilla contar ocupado para
      siempre el box de una salida olvidada (hallazgo de la revisión propia de la 8.5: 2 en
      vez de 1 a las 17:00, y 3 en vez de 2 a las 18:00) o el de un cierre olvidado, contar un
      box que no es del maestro y la frontera de la hora en punto.
    model: kpi_hora
    overrides: *hospital
    given:
      - input: ref('parametros')
        rows:
          - {run_id: c, origen: "2026-01-05 00:00:00+01", fecha_origen: "2026-01-05", calentamiento_min: 960, horizonte_min: 1140, fin_horizonte: "2026-01-05 19:00:00+01"}
      - input: ref('censo')
        rows:
          - {run_id: c, hora: "2026-01-05 16:00:00+01", k: 16, censo: 0}
          - {run_id: c, hora: "2026-01-05 17:00:00+01", k: 17, censo: 0}
          - {run_id: c, hora: "2026-01-05 18:00:00+01", k: 18, censo: 0}
      - input: ref('maestro_boxes')
        rows:
          - {box: 1}
          - {box: 2}
          - {box: 3}
          - {box: 4}
      - input: ref('ubicacion')
        rows:
          - {run_id: c, episode_id: E1, n: 1, box: 1, entrada: "2026-01-05 15:30:00+01", salida: "2026-01-05 17:00:00.000+01", motivo_salida: espera_resultados, sin_pareja: false}
          - {run_id: c, episode_id: E2, n: 1, box: 2, entrada: "2026-01-05 16:00:00.000+01", salida: null, motivo_salida: null, sin_pareja: false}
          - {run_id: c, episode_id: E3, n: 1, box: 3, entrada: "2026-01-05 16:30:00+01", salida: null, motivo_salida: null, sin_pareja: false}
          - {run_id: c, episode_id: E4, n: 1, box: 4, entrada: "2026-01-05 17:10:00+01", salida: null, motivo_salida: null, sin_pareja: true}
          - {run_id: c, episode_id: E5, n: 1, box: 1, entrada: "2026-01-05 17:30:00+01", salida: "2026-01-05 18:30:00+01", motivo_salida: salida, sin_pareja: false}
          - {run_id: c, episode_id: E6, n: 1, box: 99, entrada: "2026-01-05 16:10:00+01", salida: null, motivo_salida: null, sin_pareja: false}
      - input: ref('cohorte')
        rows:
          - {run_id: c, episode_id: E2, k: null, sigue_dentro: true, salida_olvidada: false}
          - {run_id: c, episode_id: E3, k: null, sigue_dentro: false, salida_olvidada: true}
          - {run_id: c, episode_id: E4, k: null, sigue_dentro: true, salida_olvidada: false}
          - {run_id: c, episode_id: E6, k: null, sigue_dentro: true, salida_olvidada: false}
      - input: ref('registros_vigentes')
        rows: []
      - input: ref('plantilla')
        rows: []
    expect:
      rows:
        - {run_id: c, k: 16, boxes_ocupados: 2, ocupacion_pct: 50.0}
        - {run_id: c, k: 17, boxes_ocupados: 1, ocupacion_pct: 25.0}
        - {run_id: c, k: 18, boxes_ocupados: 2, ocupacion_pct: 50.0}
