version: 2

models:
  - name: registros
    description: '{{ doc("registros") }}'
    columns:
      - name: event_id
        description: Único dentro de la ejecución; en lo registrado, el número de emisión.
      - name: event_type
      - name: run_id
      - name: episode_id
        description: Nulo en los eventos de recursos.
      - name: patient_id
      - name: source_system
      - name: event_time
        description: Cuándo pasó, con el reloj del sistema que lo anotó.
      - name: recorded_time
        description: Cuándo se anotó, con el reloj del sistema que lo anotó.
      - name: payload
      - name: ingest_time
        description: La primera llegada a Kafka. No existe en la hoja verdad.

  - name: registros_vigentes
    description: '{{ doc("registros_vigentes") }}'
    columns:
      - name: event_id
        description: El del registro que se queda; en un duplicado, el del anotado primero.
      - name: event_type
        description: Nunca record_corrected.
      - name: payload
        description: El payload tal como se anotó, con la última corrección aplicada.
      - name: corregido
        description: Si se aplicó alguna corrección a este registro.
      - name: duplicados_quitados
        description: Cuántos dobles clics del mismo registro se quitaron (0 si ninguno).

  - name: parametros
    description: '{{ doc("parametros") }}'
    data_tests:
      - clave_unica:
          arguments:
            columnas: [run_id]
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: fecha_origen
        description: La fecha del minuto 0 (fecha_inicio, o la del día 0 en la verdad).
        data_tests: [not_null]
      - name: origen
        description: El minuto 0, a las 00:00 en +01:00 de la fecha de inicio.
        data_tests: [not_null]
      - name: calentamiento_min
        description: W, el fin del calentamiento, en minutos desde el origen.
        data_tests: [not_null]
      - name: horizonte_min
        description: El horizonte, en minutos desde el origen.
        data_tests: [not_null]
      - name: inicio_ventana
        description: origen + W, donde empieza la ventana de los indicadores.
      - name: fin_horizonte
        description: origen + horizonte.
      - name: registrado
        description: >-
          Si la ejecución es lo registrado (su inicio trae el bloque registro); falso en la hoja
          verdad. La variable de los cuadros de Grafana solo ofrece las registradas (D2 de la
          8.6).
        data_tests: [not_null]
